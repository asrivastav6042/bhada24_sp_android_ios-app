name: bhada24_sp
description: Bhada24 Service Provider App - Manage your services, bookings, and grow your business.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  pinput: ^5.0.1
  flutter_staggered_animations: ^1.1.1

  # State Management
  provider: ^6.1.5

  # Navigation
  go_router: ^15.1.2

  # Network
  dio: ^5.8.0+1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  firebase_database: ^11.3.5

  # Dependency Injection
  get_it: ^8.0.3

  # Storage
  shared_preferences: ^2.5.3

  # Maps
  google_maps_flutter: ^2.12.1

  # Voice Search
  speech_to_text: ^7.0.0

  # Image handling
  image_picker: ^1.1.3

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Internationalization
  intl: ^0.20.2

  # Utilities
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/translations/
